workflows:
  android-release:
    name: Cash Check — Android APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Сгенерировать платформенные файлы Android
        script: |
          flutter create --platforms=android --project-name cash_check --org com.lunario .
      - name: Название приложения без подчёркивания
        script: |
          # pubspec обязан быть snake_case по требованию Dart,
          # поэтому видимое имя правим прямо в манифесте
          perl -pi -e 's/android:label="cash_check"/android:label="Cash Check"/' \
            android/app/src/main/AndroidManifest.xml
          grep android:label android/app/src/main/AndroidManifest.xml
      - name: Установить зависимости
        script: |
          flutter pub get
      - name: Сгенерировать иконки
        script: |
          dart run flutter_launcher_icons
      - name: Анализ кода
        script: |
          flutter analyze || true
      - name: Собрать release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - CHANGE_ME@example.com
        notify:
          success: true
          failure: true
