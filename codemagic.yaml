workflows:
  android-release:
    name: Cash Check — Android APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Сгенерировать платформенные файлы Android
        script: |
          flutter create --platforms=android --project-name cash_check --org com.lunario .
      - name: Установить зависимости
        script: |
          flutter pub get
      - name: Анализ кода
        script: |
          flutter analyze || true
      - name: Собрать release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - CHANGE_ME@example.com
        notify:
          success: true
          failure: true
